name: Build & Auto Summarize README

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      FACEBOOK_CLIENT_ID: ${{ secrets.FACEBOOK_CLIENT_ID }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
      NEXT_PUBLIC_API_ENDPOINT: ${{ secrets.NEXT_PUBLIC_API_ENDPOINT }}
      NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
      RABBIT_URL: ${{ secrets.RABBIT_URL }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      # -------------------------------
      # pnpm store cache
      # -------------------------------
      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-v20-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-v20-

      - name: Install dependencies using pnpm store
        run: pnpm install --store ~/.pnpm-store --prefer-offline

      # -------------------------------
      # Next.js build cache
      # -------------------------------
      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build Next.js
        run: pnpm build

      # -------------------------------
      # Auto summarize README using @google/genai
      # -------------------------------
      - name: Install @google/genai
        run: pnpm add @google/genai --store ~/.pnpm-store

      - name: Generate README summary with Gemini
        run: |
          node -e "
          import fs from 'fs';
          import path from 'path';
          import { TextServiceClient } from '@google/genai';

          const client = new TextServiceClient({ apiKey: process.env.GEMINI_API_KEY });

          function getAllFiles(dir, fileList = []) {
            const files = fs.readdirSync(dir);
            for (const file of files) {
              const fullPath = path.join(dir, file);
              const stat = fs.statSync(fullPath);
              if (stat.isDirectory()) {
                if (file === 'node_modules' || file === '.next') continue;
                getAllFiles(fullPath, fileList);
              } else {
                fileList.push(fullPath);
              }
            }
            return fileList;
          }

          async function generateSummary() {
            const files = getAllFiles('./');
            let codeContent = '';
            for (const file of files) {
              codeContent += fs.readFileSync(file, 'utf-8') + '\n';
            }

            const prompt = \`Summarize this project for a README.md in concise format:\n\${codeContent}\`;

            const response = await client.generateText({
              model: 'gemini-1.5-t',
              prompt,
              maxOutputTokens: 1000
            });

            fs.writeFileSync('README.md', '# Project Summary\n\n' + response.outputText);
            console.log('README.md updated!');
          }

          generateSummary();
          "

      - name: Commit and push README
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Auto-update README summary" || echo "No changes to commit"
          git push
