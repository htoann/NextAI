name: Auto Summarize README

on:
  push:
    branches:
      - master

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install openai

      - name: Generate README summary with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node -e "
          import fs from 'fs';
          import OpenAI from 'openai';

          const client = new OpenAI({ apiKey: process.env.GEMINI_API_KEY });

          // read source code
          const files = fs.readdirSync('./').filter(f => f.endsWith('.js') || f.endsWith('.ts'));
          let codeContent = '';
          for (const file of files) {
            codeContent += fs.readFileSync(file, 'utf-8') + '\n';
          }

          // summarize
          const prompt = \`Summarize this project for a README.md in concise format:\n\${codeContent}\`;

          const response = await client.chat.completions.create({
            model: 'gemini-1.5-t',
            messages: [{ role: 'user', content: prompt }]
          });

          fs.writeFileSync('README.md', '# Project Summary\n\n' + response.choices[0].message.content);
          console.log('README.md updated!');
          "

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Auto-update README summary" || echo "No changes to commit"
          git push
